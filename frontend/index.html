<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      En production, le serveur Go (backend/internal/seo) remplace tout ce qui est
      entre les deux marqueurs par l'en-tête propre à l'adresse demandée (titre,
      description, canonique, Open Graph, schema.org), et remplit #root d'un
      contenu lisible sans JavaScript. Ne pas retirer les marqueurs.
    -->
    <!--seo:head--><title data-seo>Tribbae — Les idées de la famille au même endroit</title>
    <meta data-seo name="description" content="Tribbae rassemble les idées de la famille : sorties, activités, recettes, cadeaux, livres et déco. Rangez-les en dossiers, partagez-les avec votre tribu." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tribbae" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Tribbae — Les idées de la famille au même endroit" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" /><!--/seo:head-->

    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/tribbae.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="text/plain" title="Tribbae pour les assistants IA" href="/llms.txt" />
    <meta name="theme-color" content="#FBF3E7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tribbae" />

    <!--
      Mesure d'audience Umami, sans cookie (cf. /confidentialite). analytics.js
      retire d'abord les jetons de partage et les titres d'idées des envois.
      data-domains : rien n'est mesuré hors du site de production (dev, tests).
      Refus : localStorage « umami.disabled » (bouton de la page Confidentialité).
    -->
    <script src="/analytics.js"></script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="21e9ec31-09f2-4302-ae1e-25bba5b347b6"
      data-domains="tribbae.fr"
      data-before-send="tribbaeUmamiBeforeSend"
      data-exclude-search="true"
      data-exclude-hash="true"
      data-do-not-track="true"
    ></script>

    <style>
      /* Contenu rendu par le serveur, visible le temps que l'application démarre
         (et seul visible pour les robots qui n'exécutent pas le JavaScript) */
      body { margin: 0; background: #fbf3e7; color: #3b2a26; }
      .seo-fallback { max-width: 720px; margin: 0 auto; padding: 24px 20px 64px; font: 16px/1.6 system-ui, sans-serif; }
      .seo-fallback h1 { font-size: 30px; line-height: 1.15; margin: 20px 0 12px; }
      .seo-fallback h2 { font-size: 19px; margin: 28px 0 8px; }
      .seo-fallback a { color: #c8492c; }
      .seo-fallback nav, .seo-fallback .crumbs, .seo-fallback .tags { font-size: 14px; color: #6b5047; }
      .seo-fallback ul { padding-left: 20px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
