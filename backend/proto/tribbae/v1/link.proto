syntax = "proto3";

package tribbae.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tribbae/backend/gen/tribbae/v1;tribbaev1";

enum LinkCategory {
  LINK_CATEGORY_UNSPECIFIED = 0;
  LINK_CATEGORY_IDEE = 1;
  LINK_CATEGORY_CADEAU = 2;
  LINK_CATEGORY_ACTIVITE = 3;
  LINK_CATEGORY_EVENEMENT = 4;
  LINK_CATEGORY_RECETTE = 5;
  LINK_CATEGORY_LIVRE = 6;
  LINK_CATEGORY_DECORATION = 7;
}

message Link {
  string id = 1;
  string owner_id = 2;
  string folder_id = 3;
  string title = 4;
  string url = 5;
  string description = 6;
  LinkCategory category = 7;
  repeated string tags = 8;
  string age_range = 9;
  string location = 10;
  string price = 11;
  string image_url = 12;
  int64 event_date = 13;
  bool reminder_enabled = 14;
  int32 rating = 15;
  repeated string ingredients = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  int32 like_count = 19;
  bool liked_by_me = 20;
  bool favorite = 21;
  string owner_display_name = 22;
  bool owner_is_admin = 23;
  string visibility = 24;  // "private" | "public"
  // Provenance : "mcp" pour une idée ajoutée par une application connectée
  // (Claude), vide sinon
  string created_via = 25;
  // Visible de tous parce que son auteur l'a rangée dans son dossier public
  bool public_via_folder = 26;
  // Retirée par la modération : seul son auteur la voit, sans pouvoir la republier
  bool hidden = 27;
  // Liste de cadeaux : "" (libre), reserved, bought, ou mine / mine_bought
  // pour le lecteur qui l'offre. Personne ne voit qui offre quoi.
  string gift_status = 28;
  // « C'est fait » : visible de la tribu et des membres du dossier seulement
  // (vide pour un lecteur extérieur, Explorer et le lien de partage).
  // Nombre de fois où l'idée a été faite
  int32 done_count = 29;
  // Dernier jour où elle a été faite (midi UTC de ce jour : la date seule compte)
  google.protobuf.Timestamp last_done_at = 30;
  // « À refaire »
  bool redo = 31;
  // « Pas cette fois » a été répondu au rappel d'une sortie passée
  bool done_prompt_dismissed = 32;
  // Idée publique : nombre de tribus qui l'ont faite, renvoyé à partir de 5
  // (0 en dessous). Anonyme : ni nom ni photo.
  int32 done_families = 33;
}

// Un souvenir : une fois où l'idée a été faite
message LinkDone {
  string id = 1;
  string link_id = 2;
  // Qui l'a marquée
  string user_id = 3;
  // Jour, sans heure : AAAA-MM-JJ
  string done_on = 4;
  // Qui était là : comptes et enfants de la tribu
  repeated string with_user_ids = 5;
  repeated string with_child_ids = 6;
  // 0 = pas de note
  int32 rating = 7;
  string note = 8;
  string photo_url = 9;
  google.protobuf.Timestamp created_at = 10;
}

message MarkLinkDoneRequest {
  string link_id = 1;
  // AAAA-MM-JJ ; aujourd'hui si vide, jamais dans le futur
  string done_on = 2;
  repeated string with_user_ids = 3;
  repeated string with_child_ids = 4;
  int32 rating = 5;
  string note = 6;
  // Photo déjà envoyée par POST /v1/photos
  string photo_url = 7;
  // « À refaire », porté par l'idée ; absent = inchangé
  optional bool redo = 8;
}

message LinkDoneResponse {
  LinkDone done = 1;
  Link link = 2;
}

message UpdateLinkDoneRequest {
  string link_id = 1;
  string done_id = 2;
  string done_on = 3;
  repeated string with_user_ids = 4;
  repeated string with_child_ids = 5;
  int32 rating = 6;
  string note = 7;
  string photo_url = 8;
  optional bool redo = 9;
}

message UnmarkLinkDoneRequest {
  string link_id = 1;
  string done_id = 2;
}

message UnmarkLinkDoneResponse {
  Link link = 1;
}

message ListLinkDonesRequest {
  string link_id = 1;
}

message ListLinkDonesResponse {
  // Du plus récent au plus ancien
  repeated LinkDone dones = 1;
}

message DismissDonePromptRequest {
  string link_id = 1;
}

message DismissDonePromptResponse {
  Link link = 1;
}

message GetDoneSummaryRequest {
  int32 year = 1;
}

// « Notre année en idées » : chaque fois compte (une recette refaite trois
// fois compte trois)
message GetDoneSummaryResponse {
  int32 year = 1;
  // Sorties et activités
  int32 outings = 2;
  int32 recipes = 3;
  int32 books = 4;
  int32 total = 5;
  // 1 à 12 ; 0 si rien n'a été fait
  int32 best_month = 6;
  int32 best_month_count = 7;
}

message CreateLinkRequest {
  string folder_id = 1;
  string title = 2;
  string url = 3;
  string description = 4;
  LinkCategory category = 5;
  repeated string tags = 6;
  string age_range = 7;
  string location = 8;
  string price = 9;
  string image_url = 10;
  int64 event_date = 11;
  bool reminder_enabled = 12;
  int32 rating = 13;
  repeated string ingredients = 14;
  bool favorite = 15;
  string visibility = 16;  // "private" | "public"
}

message CreateLinkResponse {
  Link link = 1;
}

message GetLinkRequest {
  string link_id = 1;
}

message GetLinkResponse {
  Link link = 1;
}

message ListLinksRequest {
  string folder_id = 1;
  // all (défaut) | todo | done
  string status = 2;
}

message ListLinksResponse {
  repeated Link links = 1;
}

message UpdateLinkRequest {
  string link_id = 1;
  string folder_id = 2;
  string title = 3;
  string url = 4;
  string description = 5;
  LinkCategory category = 6;
  repeated string tags = 7;
  string age_range = 8;
  string location = 9;
  string price = 10;
  string image_url = 11;
  int64 event_date = 12;
  bool reminder_enabled = 13;
  int32 rating = 14;
  repeated string ingredients = 15;
  bool favorite = 16;
  string visibility = 17;  // "private" | "public"
}

message UpdateLinkResponse {
  Link link = 1;
}

message DeleteLinkRequest {
  string link_id = 1;
}

message DeleteLinkResponse {}

message LikeLinkRequest {
  string link_id = 1;
}

message LikeLinkResponse {
  int32 like_count = 1;
}

message UnlikeLinkRequest {
  string link_id = 1;
}

message UnlikeLinkResponse {
  int32 like_count = 1;
}

message ListLikedLinksRequest {}

message ListLikedLinksResponse {
  repeated Link links = 1;
}

message ToggleFavoriteLinkRequest {
  string link_id = 1;
}

message ToggleFavoriteLinkResponse {
  bool favorite = 1;
}

message ListCommunityLinksRequest {
  string category = 1;  // optionnel, filtre par catégorie
  int32 limit = 2;      // max par catégorie, défaut 6
}

message ListCommunityLinksResponse {
  repeated Link links = 1;
}

message ListNewLinksRequest {
  int32 limit = 1;  // nombre de nouveautés, défaut 10
}

message ListNewLinksResponse {
  repeated Link links = 1;
}

service LinkService {
  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse) {
    option (google.api.http) = {
      post: "/v1/links"
      body: "*"
    };
  }
  rpc GetLink(GetLinkRequest) returns (GetLinkResponse) {
    option (google.api.http) = {
      get: "/v1/links/{link_id}"
    };
  }
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse) {
    option (google.api.http) = {
      get: "/v1/links"
    };
  }
  rpc UpdateLink(UpdateLinkRequest) returns (UpdateLinkResponse) {
    option (google.api.http) = {
      put: "/v1/links/{link_id}"
      body: "*"
    };
  }
  rpc DeleteLink(DeleteLinkRequest) returns (DeleteLinkResponse) {
    option (google.api.http) = {
      delete: "/v1/links/{link_id}"
    };
  }
  rpc LikeLink(LikeLinkRequest) returns (LikeLinkResponse) {
    option (google.api.http) = {
      post: "/v1/links/{link_id}/like"
      body: "*"
    };
  }
  rpc UnlikeLink(UnlikeLinkRequest) returns (UnlikeLinkResponse) {
    option (google.api.http) = {
      delete: "/v1/links/{link_id}/like"
    };
  }
  // Idées aimées par le compte, la plus récemment aimée d'abord
  rpc ListLikedLinks(ListLikedLinksRequest) returns (ListLikedLinksResponse) {
    option (google.api.http) = {
      get: "/v1/liked-links"
    };
  }
  // Remplacé par le J'aime, gardé pour les anciennes versions des clients
  rpc ToggleFavoriteLink(ToggleFavoriteLinkRequest) returns (ToggleFavoriteLinkResponse) {
    option (google.api.http) = {
      post: "/v1/links/{link_id}/favorite"
      body: "*"
    };
  }
  // « C'est fait » : l'idée a été faite, avec un souvenir facultatif
  rpc MarkLinkDone(MarkLinkDoneRequest) returns (LinkDoneResponse) {
    option (google.api.http) = {
      post: "/v1/links/{link_id}/done"
      body: "*"
    };
  }
  rpc UpdateLinkDone(UpdateLinkDoneRequest) returns (LinkDoneResponse) {
    option (google.api.http) = {
      patch: "/v1/links/{link_id}/done/{done_id}"
      body: "*"
    };
  }
  rpc UnmarkLinkDone(UnmarkLinkDoneRequest) returns (UnmarkLinkDoneResponse) {
    option (google.api.http) = {
      delete: "/v1/links/{link_id}/done/{done_id}"
    };
  }
  rpc ListLinkDones(ListLinkDonesRequest) returns (ListLinkDonesResponse) {
    option (google.api.http) = {
      get: "/v1/links/{link_id}/done"
    };
  }
  // « Pas cette fois » : ne plus demander si la sortie passée a été faite
  rpc DismissDonePrompt(DismissDonePromptRequest) returns (DismissDonePromptResponse) {
    option (google.api.http) = {
      post: "/v1/links/{link_id}/done-prompt/dismiss"
      body: "*"
    };
  }
  rpc GetDoneSummary(GetDoneSummaryRequest) returns (GetDoneSummaryResponse) {
    option (google.api.http) = {
      get: "/v1/done/summary"
    };
  }
  rpc ListCommunityLinks(ListCommunityLinksRequest) returns (ListCommunityLinksResponse) {
    option (google.api.http) = {
      get: "/v1/community/links"
    };
  }
  rpc ListNewLinks(ListNewLinksRequest) returns (ListNewLinksResponse) {
    option (google.api.http) = {
      get: "/v1/community/new"
    };
  }
}
