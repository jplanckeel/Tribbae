syntax = "proto3";

package tribbae.v1;

import "google/api/annotations.proto";

option go_package = "github.com/tribbae/backend/gen/tribbae/v1;tribbaev1";

// --- Messages ---

message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message RegisterResponse {
  string user_id = 1;
  string token = 2;
  bool is_admin = 3;
  // Adresse confirmée par le lien reçu par email (faux à l'inscription)
  bool email_verified = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string token = 2;
  string display_name = 3;
  bool is_admin = 4;
  bool email_verified = 5;
}

message RefreshTokenRequest {
  string token = 1;
}

message RefreshTokenResponse {
  string token = 1;
}

// Mot de passe oublié : envoie un lien de réinitialisation par email. La
// réponse est la même que l'adresse ait un compte ou non.
message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

// Nouveau mot de passe choisi depuis le lien reçu par email. Les sessions
// ouvertes avant sont fermées ; la réponse ouvre une nouvelle session.
message ResetPasswordRequest {
  string token = 1;
  string password = 2;
}

message ResetPasswordResponse {
  string user_id = 1;
  string token = 2;
  string display_name = 3;
  bool is_admin = 4;
  // Toujours vrai : le lien prouve que l'on reçoit les emails de l'adresse
  bool email_verified = 5;
}

// Compte connecté, relu au lancement des applications (adresse confirmée…).
message GetAccountRequest {}

message GetAccountResponse {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  bool is_admin = 4;
  bool email_verified = 5;
}

// Confirmation de l'adresse depuis le lien reçu par email. Ne demande pas de
// session : le lien peut être ouvert sur un autre appareil.
message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {}

// Renvoie le lien de confirmation au compte connecté.
message ResendEmailVerificationRequest {}

message ResendEmailVerificationResponse {
  // Vrai si l'adresse était déjà confirmée (aucun email envoyé)
  bool email_verified = 1;
}

// --- Service ---

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/v1/auth/password/forgot"
      body: "*"
    };
  }
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/password/reset"
      body: "*"
    };
  }
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {
      get: "/v1/auth/me"
    };
  }
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/email/verify"
      body: "*"
    };
  }
  rpc ResendEmailVerification(ResendEmailVerificationRequest) returns (ResendEmailVerificationResponse) {
    option (google.api.http) = {
      post: "/v1/auth/email/resend"
      body: "*"
    };
  }
}
