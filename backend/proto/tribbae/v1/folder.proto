syntax = "proto3";

package tribbae.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "tribbae/v1/link.proto";

option go_package = "github.com/tribbae/backend/gen/tribbae/v1;tribbaev1";

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_PUBLIC = 2;       // communautaire, visible par tous
  VISIBILITY_SHARED = 3;       // partagé avec des collaborateurs spécifiques
}

enum CollaboratorRole {
  COLLABORATOR_ROLE_UNSPECIFIED = 0;
  COLLABORATOR_ROLE_VIEWER = 1;
  COLLABORATOR_ROLE_EDITOR = 2;
}

message Collaborator {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  CollaboratorRole role = 4;
  google.protobuf.Timestamp added_at = 5;
}

message Folder {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  string icon = 4;
  string color = 5;
  Visibility visibility = 6;
  string share_token = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated Collaborator collaborators = 10;
  string owner_display_name = 11;
  int32 link_count = 12;
  int32 like_count = 13;
  bool liked_by_me = 14;
  bool ai_generated = 15;
  string banner_url = 16;
  repeated string tags = 17;
  bool owner_is_admin = 18;
  // Personnalisation (écran « Personnaliser »)
  string description = 19;        // « un petit mot », ex. « Pour ses 10 ans »
  string cover = 20;              // "" (auto) | illu | uni | tipis | pois | rayures | photo
  string illustration = 21;       // dessin de la couverture "illu" ; "" = choisi selon le nom / la date clé
  int64 key_date = 22;            // date clé (ms), 0 = aucune
  string key_date_type = 23;      // anniv | vacances | event
  repeated string child_ids = 24; // « Pour qui » : enfants de la tribu
  string view_mode = 25;          // grid | list | mosaic
  string sort = 26;               // recent | date | category
  bool pinned = 27;               // épinglé en haut de « Mes idées »
}

message CreateFolderRequest {
  string name = 1;
  string icon = 2;
  string color = 3;
  Visibility visibility = 4;
  string banner_url = 5;
  repeated string tags = 6;
  string description = 7;
  string cover = 8;
  string illustration = 9;
  int64 key_date = 10;
  string key_date_type = 11;
  repeated string child_ids = 12;
  string view_mode = 13;
  string sort = 14;
  bool pinned = 15;
}

message CreateFolderResponse {
  Folder folder = 1;
}

message GetFolderRequest {
  string folder_id = 1;
}

message GetFolderResponse {
  Folder folder = 1;
}

message ListFoldersRequest {}

message ListFoldersResponse {
  repeated Folder folders = 1;
}

message UpdateFolderRequest {
  string folder_id = 1;
  string name = 2;
  string icon = 3;
  string color = 4;
  Visibility visibility = 5;
  string banner_url = 6;
  repeated string tags = 7;
  // Personnalisation : facultatifs pour qu'un client plus ancien qui ne les
  // envoie pas ne les efface pas.
  optional string description = 8;
  optional string cover = 9;
  optional string illustration = 10;
  optional int64 key_date = 11;
  optional string key_date_type = 12;
  repeated string child_ids = 13;   // pris en compte seulement si set_child_ids
  bool set_child_ids = 14;
  optional string view_mode = 15;
  optional string sort = 16;
  optional bool pinned = 17;
}

message UpdateFolderResponse {
  Folder folder = 1;
}

message DeleteFolderRequest {
  string folder_id = 1;
}

message DeleteFolderResponse {}

message GenerateShareTokenRequest {
  string folder_id = 1;
}

message GenerateShareTokenResponse {
  string share_token = 1;
  string share_url = 2;
}

message GetSharedFolderRequest {
  string share_token = 1;
}

message GetSharedFolderResponse {
  Folder folder = 1;
  repeated Link links = 2;
}

// --- Collaborateurs ---

message AddCollaboratorRequest {
  string folder_id = 1;
  string email = 2;
  CollaboratorRole role = 3;
}

message AddCollaboratorResponse {
  Folder folder = 1;
}

message RemoveCollaboratorRequest {
  string folder_id = 1;
  string user_id = 2;
}

message RemoveCollaboratorResponse {
  Folder folder = 1;
}

// --- Invitations dans le cercle ---
//
// Un proche (compte ou non) est invité par email à des dossiers choisis : il
// n'y entre qu'en acceptant le lien reçu, avec le compte de l'adresse invitée.
// Taper une adresse ne dit pas si elle a un compte. Une seule invitation par
// propriétaire et par adresse : en refaire une ajoute les dossiers choisis.

message CircleInvitation {
  string id = 1;
  string email = 2;
  CollaboratorRole role = 3;
  repeated string folder_ids = 4;
  repeated string folder_names = 5;
  int64 created_at = 6;  // millisecondes (dernier envoi)
  int64 expires_at = 7;  // millisecondes
}

message InviteToCircleRequest {
  string email = 1;
  repeated string folder_ids = 2;  // dossiers dont on est propriétaire
  CollaboratorRole role = 3;
}

message InviteToCircleResponse {
  CircleInvitation invitation = 1;
}

// Invitations en attente envoyées par le compte connecté.
message ListCircleInvitationsRequest {}

message ListCircleInvitationsResponse {
  repeated CircleInvitation invitations = 1;
}

message RevokeCircleInvitationRequest {
  string invitation_id = 1;
}

message RevokeCircleInvitationResponse {}

// Ce qu'affiche le lien d'invitation, avant de l'accepter (sans compte).
message GetCircleInvitationRequest {
  string token = 1;
}

message GetCircleInvitationResponse {
  string email = 1;  // adresse invitée : le compte qui accepte doit l'utiliser
  string invited_by_name = 2;
  repeated string folder_names = 3;
  CollaboratorRole role = 4;
  int64 expires_at = 5;  // millisecondes
}

message AcceptCircleInvitationRequest {
  string token = 1;
}

message AcceptCircleInvitationResponse {
  repeated Folder folders = 1;  // dossiers désormais ouverts au compte
}

// --- Communautaire ---

message ListCommunityFoldersRequest {
  string search = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListCommunityFoldersResponse {
  repeated Folder folders = 1;
  string next_page_token = 2;
}

message LikeFolderRequest {
  string folder_id = 1;
}

message LikeFolderResponse {
  int32 like_count = 1;
}

message UnlikeFolderRequest {
  string folder_id = 1;
}

message UnlikeFolderResponse {
  int32 like_count = 1;
}

message ListTopFoldersRequest {
  int32 limit = 1;
}

message ListTopFoldersResponse {
  repeated Folder folders = 1;
}

service FolderService {
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse) {
    option (google.api.http) = {
      post: "/v1/folders"
      body: "*"
    };
  }
  rpc GetFolder(GetFolderRequest) returns (GetFolderResponse) {
    option (google.api.http) = {
      get: "/v1/folders/{folder_id}"
    };
  }
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse) {
    option (google.api.http) = {
      get: "/v1/folders"
    };
  }
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse) {
    option (google.api.http) = {
      put: "/v1/folders/{folder_id}"
      body: "*"
    };
  }
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse) {
    option (google.api.http) = {
      delete: "/v1/folders/{folder_id}"
    };
  }
  rpc GenerateShareToken(GenerateShareTokenRequest) returns (GenerateShareTokenResponse) {
    option (google.api.http) = {
      post: "/v1/folders/{folder_id}/share"
      body: "*"
    };
  }
  rpc GetSharedFolder(GetSharedFolderRequest) returns (GetSharedFolderResponse) {
    option (google.api.http) = {
      get: "/v1/share/{share_token}"
    };
  }
  rpc AddCollaborator(AddCollaboratorRequest) returns (AddCollaboratorResponse) {
    option (google.api.http) = {
      post: "/v1/folders/{folder_id}/collaborators"
      body: "*"
    };
  }
  rpc RemoveCollaborator(RemoveCollaboratorRequest) returns (RemoveCollaboratorResponse) {
    option (google.api.http) = {
      delete: "/v1/folders/{folder_id}/collaborators/{user_id}"
    };
  }
  rpc InviteToCircle(InviteToCircleRequest) returns (InviteToCircleResponse) {
    option (google.api.http) = {
      post: "/v1/circle/invitations"
      body: "*"
    };
  }
  rpc ListCircleInvitations(ListCircleInvitationsRequest) returns (ListCircleInvitationsResponse) {
    option (google.api.http) = {
      get: "/v1/circle/invitations"
    };
  }
  rpc RevokeCircleInvitation(RevokeCircleInvitationRequest) returns (RevokeCircleInvitationResponse) {
    option (google.api.http) = {
      delete: "/v1/circle/invitations/{invitation_id}"
    };
  }
  rpc GetCircleInvitation(GetCircleInvitationRequest) returns (GetCircleInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/circle/invitations/lookup"
      body: "*"
    };
  }
  rpc AcceptCircleInvitation(AcceptCircleInvitationRequest) returns (AcceptCircleInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/circle/invitations/accept"
      body: "*"
    };
  }
  rpc ListCommunityFolders(ListCommunityFoldersRequest) returns (ListCommunityFoldersResponse) {
    option (google.api.http) = {
      get: "/v1/community/folders"
    };
  }
  rpc LikeFolder(LikeFolderRequest) returns (LikeFolderResponse) {
    option (google.api.http) = {
      post: "/v1/folders/{folder_id}/like"
      body: "*"
    };
  }
  rpc UnlikeFolder(UnlikeFolderRequest) returns (UnlikeFolderResponse) {
    option (google.api.http) = {
      delete: "/v1/folders/{folder_id}/like"
    };
  }
  rpc ListTopFolders(ListTopFoldersRequest) returns (ListTopFoldersResponse) {
    option (google.api.http) = {
      get: "/v1/community/top"
    };
  }
}
