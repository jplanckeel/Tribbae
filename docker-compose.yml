version: "3.8"

services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:9
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tribbae
    networks:
      - internal

  # ── Backend Go ───────────────────────────────────────────
  backend:
    image: jplanckeel/tribbae:latest
    restart: unless-stopped
    depends_on:
      - mongo
      - ollama
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: tribbae
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: "8080"
      GRPC_PORT: "9090"
      BASE_URL: ${BASE_URL:-http://backend:8080}
      # Adresse publique (adresses canoniques, sitemap.xml, llms.txt, aperçus de partage)
      SITE_URL: ${SITE_URL:-https://tribbae.fr}
      # Ancien domaine et www : tout est redirigé vers SITE_URL
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:-tribbae.bananaops.cloud,www.tribbae.fr}
      OLLAMA_URL: http://ollama:11434
      # Petit modèle pour un VPS 2 CPU sans GPU (téléchargé automatiquement au démarrage)
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-2}
      # Compte admin tribbae@bananaops.cloud (≥ 12 caractères). Remplace aussi l'ancien mot de passe par défaut.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Emails transactionnels (Brevo) ; sans clé, ils sont seulement journalisés
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-contact@tribbae.fr}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tribbae}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    labels:
      - "traefik.enable=true"
      # tribbae.fr, sa variante www et l'ancien domaine (redirigés par l'application)
      - "traefik.http.routers.tribbae-backend.rule=Host(`${BACKEND_HOST:-tribbae.fr}`) || Host(`www.${BACKEND_HOST:-tribbae.fr}`) || Host(`${LEGACY_HOST:-tribbae.bananaops.cloud}`)"
      - "traefik.http.routers.tribbae-backend.entrypoints=websecure"
      - "traefik.http.routers.tribbae-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.tribbae-backend.loadbalancer.server.port=8080"
    networks:
      - internal
      - dokploy-network

  # ── Ollama (IA) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Le modèle reste chargé entre deux demandes (évite ~5 s de chargement)
      OLLAMA_KEEP_ALIVE: "30m"
    networks:
      - internal

volumes:
  mongo_data:
  ollama_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
