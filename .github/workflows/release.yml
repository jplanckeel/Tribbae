name: Release

# Appelé par release-please.yml quand une release est créée (le tag posé avec
# GITHUB_TOKEN ne déclenche pas ce workflow tout seul). Le push manuel d'un
# tag v* reste possible : la release est alors créée ici avec des notes auto.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag de la release (ex. v1.2.3)
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Moindre privilège par défaut ; un job qui doit écrire le déclare lui-même
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      # Keystore de signature : sans lui, l'APK sortirait non signé et Android
      # refuserait de l'installer (« le package ne semble pas valide »). On
      # échoue plutôt que de publier un APK inutilisable.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : impossible de signer l'APK"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --min-sdk-version 24 composeApp/build/outputs/apk/release/composeApp-release.apk
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Rename APK
        run: |
          mv composeApp/build/outputs/apk/release/composeApp-release.apk \
             "tribbae-${TAG#v}.apk"
          # Table de correspondance R8 : nécessaire pour relire les traces de
          # plantage de cette version (noms de classes et de méthodes raccourcis)
          gzip -c composeApp/build/outputs/mapping/release/mapping.txt > "tribbae-${TAG#v}-mapping.txt.gz"

      # Release déjà créée par release-please : on y ajoute l'APK sans toucher à son
      # changelog. Tag poussé à la main : on crée la release avec des notes auto.
      - name: Publish APK to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            tribbae-*.apk
            tribbae-*-mapping.txt.gz
          draft: false
          prerelease: false
          generate_release_notes: ${{ inputs.tag == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      
      # QEMU : étapes RUN de l'image finale pour l'architecture non native
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
      
      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Serveur en amd64, postes de dev en arm64 (Mac Apple Silicon)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tribbae:latest
            ${{ secrets.DOCKER_USERNAME }}/tribbae:${{ steps.version.outputs.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tribbae:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tribbae:buildcache,mode=max
