use_default_settings: true

search:
  formats:
    - html
    - json
  default_lang: "fr"
  # Application familiale : filtrage modéré par défaut (le backend envoie aussi safesearch=1)
  safe_search: 1

server:
  secret_key: "tribbae-searxng-secret-key-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"

outgoing:
  # Le backend accorde 12 s à la recherche : un moteur lent est abandonné avant
  request_timeout: 6.0
  max_request_timeout: 10.0

ui:
  static_use_hash: true

general:
  instance_name: "Tribbae Search"
  enable_metrics: false

# Configuration du limiteur (désactivé mais configuré pour être permissif)
limiter:
  enabled: false

# Désactiver la détection de bots
botdetection:
  ip_limit:
    enabled: false
  ip_lists:
    pass_ip:
      - "0.0.0.0/0"
      - "::/0"

engines:
  # Depuis l'IP d'un VPS (datacenter), Google, Qwant et Startpage (qui interroge
  # Google) répondent 403 / CAPTCHA puis sont suspendus 180 s : désactivés pour
  # ne pas perdre de temps ni remplir les journaux.
  - name: google
    disabled: true
  - name: qwant
    disabled: true
  - name: startpage
    disabled: true
  - name: brave
    disabled: true
  - name: wikidata
    disabled: true
  # (« google cse », recherche personnalisée publique de Google, reste actif par
  # défaut : il passe mieux que la recherche Google classique.)
  # Moteurs qui tolèrent le mieux une IP de serveur (à surveiller dans les journaux :
  # un moteur bloqué apparaît en « suspended »)
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: mojeek
    disabled: false
  # API publique, jamais bloquée : utile pour les sorties (lieux, musées, parcs)
  - name: wikipedia
    disabled: false
    shortcut: wp
